<!DOCTYPE html>
<html lang="en">
<head>
    <title>Todo App</title>

    <style>
        body {
            background: #0f0f1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 20px rgba(128,0,255,0.3);
        }

        h2 {
            text-align: center;
            color: #b084ff;
        }

        input {
            width: 65%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #7b2cff;
            color: white;
            cursor: pointer;
        }

        .todo {
            background: #2a2a40;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            background: #ff4d6d;
        }

        .update {
            background: #9d4edd;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Todo App</h2>

    <input id="todoInput" placeholder="Enter task">
    <button id="addBtn">Add</button>

    <div id="list"></div>
</div>

<script>
const API = "http://localhost:5000/todos";

// 🔹 Load Todos
async function loadTodos() {
    try {
        const res = await fetch(API);
        const data = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        data.forEach(todo => {
            const div = document.createElement("div");
            div.className = "todo";

            div.innerHTML = `
                <span>${todo.text}</span>
                <div>
                    <button class="update" data-id="${todo.id}">Edit</button>
                    <button class="delete" data-id="${todo.id}">Delete</button>
                </div>
            `;

            list.appendChild(div);
        });

    } catch (err) {
        console.error("Load error:", err);
    }
}

// 🔹 Add Todo
async function addTodo() {
    const input = document.getElementById("todoInput");
    const text = input.value.trim();

    if (!text) {
        alert("Enter something!");
        return;
    }

    try {
        await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });

        input.value = "";
        loadTodos();

    } catch (err) {
        console.error("Add error:", err);
    }
}

// 🔹 Delete Todo
async function deleteTodo(id) {
    try {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        loadTodos();
    } catch (err) {
        console.error("Delete error:", err);
    }
}

// 🔹 Update Todo
async function updateTodo(id) {
    const newText = prompt("Enter updated task:");
    if (!newText) return;

    try {
        await fetch(`${API}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: newText })
        });

        loadTodos();
    } catch (err) {
        console.error("Update error:", err);
    }
}

// 🔥 EVENT LISTENERS (fix for button not working issue)

// Add button
document.getElementById("addBtn").addEventListener("click", addTodo);

// Event delegation for Edit/Delete buttons
document.getElementById("list").addEventListener("click", function(e) {
    const id = e.target.getAttribute("data-id");

    if (e.target.classList.contains("delete")) {
        deleteTodo(id);
    }

    if (e.target.classList.contains("update")) {
        updateTodo(id);
    }
});

// Load on start
window.onload = loadTodos;
</script>

</body>
</html>
