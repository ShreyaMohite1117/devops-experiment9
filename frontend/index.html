<!DOCTYPE html>
<html lang="en">
<head>
    <title>Global Todo App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0e15;
            --container-bg: rgba(26, 27, 46, 0.75);
            --primary: #8a2be2;
            --primary-hover: #9d4edd;
            --danger: #ff4d6d;
            --success: #06d6a0;
            --text-main: #ffffff;
            --text-muted: #a0a0b5;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, #2a1b54 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, #1a0b2e 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--container-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 35px;
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .header-info {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0 0 5px 0;
            font-weight: 800;
            background: linear-gradient(135deg, #b084ff, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .date-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            position: relative;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(138, 43, 226, 0.15);
            background: rgba(0, 0, 0, 0.5);
        }

        button.btn-primary {
            padding: 16px 24px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #ff2a85);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 42, 133, 0.45);
        }

        button.btn-primary:active {
            transform: translateY(1px);
        }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 10px;
        }

        .todo-list::-webkit-scrollbar { width: 6px; }
        .todo-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .todo {
            background: rgba(255, 255, 255, 0.04);
            padding: 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s ease forwards;
            gap: 12px;
        }

        .todo:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .todo.completed {
            opacity: 0.55;
            background: rgba(6, 214, 160, 0.04);
            border-color: rgba(6, 214, 160, 0.1);
        }

        .todo.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .todo-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-grow: 1;
            overflow: hidden;
        }

        .checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }

        .checkbox:checked {
            background: var(--success);
            border-color: var(--success);
            transform: scale(1.1);
        }

        .checkbox:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 13px;
        }

        .todo-text {
            word-break: break-word;
            line-height: 1.4;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .todo-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
            opacity: 0.7;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(10px);
        }

        .todo:hover .actions {
            opacity: 1;
            transform: translateX(0);
        }

        .actions button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            font-size: 0.95rem;
        }

        .update { background: rgba(255, 255, 255, 0.08); }
        .update:hover { background: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(138,43,226,0.3); }

        .delete { background: rgba(255, 77, 109, 0.15); color: var(--danger) !important; }
        .delete:hover { background: var(--danger); color: white !important; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,77,109,0.3); }

        .stats {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
            font-weight: 500;
        }
        
        .stat-badge {
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 12px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-style: italic;
            animation: fadeIn 0.5s ease;
        }
        
        .empty-state i {
            color: rgba(255,255,255,0.1);
            margin-bottom: 15px;
        }

        .designer-signature {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        
        .designer-signature:hover {
            opacity: 1;
        }
        
        .designer-signature .heart {
            color: var(--danger);
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }
        
        .designer-signature .name {
            color: #ff7eb3;
            font-weight: 700;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        
        .loading {
            opacity: 0.5;
            pointer-events: none;
            filter: blur(2px);
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-info">
        <h2><i class="fa-solid fa-bolt"></i> FlowState</h2>
        <div class="date-badge" id="currentDate"><i class="fa-regular fa-calendar"></i> Loading date...</div>
    </div>

    <div class="input-group">
        <input type="text" id="todoInput" placeholder="What's your next move?" autocomplete="off">
        <button id="addBtn" class="btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <div id="list" class="todo-list"></div>
    
    <div class="stats" id="stats">
        <span class="stat-badge" id="itemsLeft"><i class="fa-regular fa-circle"></i> 0 pending</span>
        <span class="stat-badge" id="itemsCompleted"><i class="fa-solid fa-check-circle" style="color: var(--success)"></i> 0 done</span>
    </div>
</div>

<div class="designer-signature">
    Designed with <i class="fa-solid fa-heart heart"></i> by <span class="name">Shreya</span>
</div>

<script>
const API = "http://localhost:30008/todos";
const listEl = document.getElementById("list");
const inputEl = document.getElementById("todoInput");
const addBtn = document.getElementById("addBtn");
const itemsLeftEl = document.getElementById("itemsLeft");
const itemsCompletedEl = document.getElementById("itemsCompleted");

// Set Current Date
document.getElementById("currentDate").innerHTML = `<i class="fa-regular fa-calendar"></i> ` + new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

// Format task date
function formatTime(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

// 🔹 Load Todos
async function loadTodos() {
    listEl.classList.add("loading");
    try {
        const res = await fetch(API);
        if (!res.ok) throw new Error("Failed to fetch");
        const data = await res.json();
        
        listEl.innerHTML = "";
        
        // Update Stats
        const active = data.filter(t => !t.completed).length;
        const completed = data.length - active;
        itemsLeftEl.innerHTML = `<i class="fa-regular fa-circle"></i> ${active} pending`;
        itemsCompletedEl.innerHTML = `<i class="fa-solid fa-check-circle" style="color: var(--success)"></i> ${completed} done`;

        if (data.length === 0) {
            listEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-ghost fa-3x"></i><br>Nothing to do yet. Create a task!</div>';
            return;
        }

        // Sort: active first, then completed
        data.sort((a, b) => a.completed - b.completed).forEach(todo => {
            const div = document.createElement("div");
            div.className = `todo ${todo.completed ? 'completed' : ''}`;
            const timeStr = formatTime(todo.createdAt) || 'Just now';
            
            div.innerHTML = `
                <div class="todo-content">
                    <input type="checkbox" class="checkbox" data-id="${todo.id}" ${todo.completed ? 'checked' : ''}>
                    <div>
                        <div class="todo-text">${escapeHTML(todo.text)}</div>
                        <span class="todo-date"><i class="fa-regular fa-clock"></i> ${timeStr}</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="update" data-id="${todo.id}" title="Edit"><i class="fa-solid fa-pen-nib"></i></button>
                    <button class="delete" data-id="${todo.id}" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
            listEl.appendChild(div);
        });

    } catch (err) {
        console.error("Load error:", err);
        listEl.innerHTML = '<div class="empty-state" style="color: var(--danger)"><i class="fa-solid fa-triangle-exclamation fa-3x"></i><br>Connection lost to backend server.</div>';
    } finally {
        listEl.classList.remove("loading");
    }
}

// 🔹 Add Todo
async function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;

    addBtn.disabled = true;
    addBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });
        
        if (res.ok) {
            inputEl.value = "";
            await loadTodos();
        }
    } catch (err) {
        console.error("Add error:", err);
    } finally {
        addBtn.disabled = false;
        addBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
        inputEl.focus();
    }
}

// 🔹 Delete Todo
async function deleteTodo(id) {
    try {
        const res = await fetch(`${API}/${id}`, { method: "DELETE" });
        if (res.ok) {
            await loadTodos();
        }
    } catch (err) {
        console.error("Delete error:", err);
    }
}

// 🔹 Update Todo Text
async function updateTodoText(id, currentText) {
    const newText = prompt("Revise your task:", currentText);
    if (newText === null || !newText.trim() || newText.trim() === currentText) return;

    try {
        await fetch(`${API}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: newText.trim() })
        });
        await loadTodos();
    } catch (err) {
        console.error("Update error:", err);
    }
}

// 🔹 Toggle Todo Status
async function toggleTodoStatus(id, isCompleted) {
    try {
        await fetch(`${API}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ completed: isCompleted })
        });
        await loadTodos();
    } catch (err) {
        console.error("Toggle error:", err);
    }
}

// Helper: escape HTML
function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

// Event Listeners
addBtn.addEventListener("click", addTodo);

inputEl.addEventListener("keypress", (e) => {
    if (e.key === "Enter") addTodo();
});

listEl.addEventListener("click", (e) => {
    const target = e.target.closest('button') || e.target;
    
    if (target.classList.contains("checkbox")) {
        const id = target.getAttribute("data-id");
        toggleTodoStatus(id, target.checked);
        return;
    }
    
    if (target.tagName !== "BUTTON") return;
    
    const id = target.getAttribute("data-id");
    if (target.classList.contains("delete")) {
        deleteTodo(id);
    } else if (target.classList.contains("update")) {
        const currentText = target.closest('.todo').querySelector('.todo-text').innerText;
        updateTodoText(id, currentText);
    }
});

// Load on start
window.onload = loadTodos;
</script>

</body>
</html>
